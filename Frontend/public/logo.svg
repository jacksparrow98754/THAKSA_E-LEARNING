<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Icon: Abstract T + Upward Arrow -->
  <g transform="translate(10, 15)">
    <!-- Main vertical block -->
    <rect x="30" y="25" width="16" height="45" rx="4" fill="#0A2540"/>
    <!-- Top horizontal left block -->
    <rect x="0" y="25" width="22" height="16" rx="4" fill="#0A2540"/>
    <!-- Upward swoosh / tech node for the right side of the T -->
    <path d="M40 33 L65 8 L85 8 C88 8 90 10 90 13 C90 15 89 17 87 18 L55 50 Z" fill="#00D4FF"/>
    <!-- Small dot representing a node/student -->
    <circle cx="75" cy="40" r="6" fill="#00D4FF"/>
  </g>
  <!-- Logotype -->
  <text x="110" y="65" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44" font-weight="800" fill="#0A2540" letter-spacing="2">THAKSA</text>
  <!-- Tagline -->
  <text x="114" y="85" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="700" fill="#00D4FF" letter-spacing="5">E-LEARNING</text>
</svg>
